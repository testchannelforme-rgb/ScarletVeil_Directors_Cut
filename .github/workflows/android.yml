name: Build Scarlet Veil Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Godot project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/project.godot" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            PROJECT_FILE="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name project.godot \
              -not -path '*/.git/*' \
              -print -quit)"

            if [ -z "${PROJECT_FILE:-}" ]; then
              echo "ERROR: project.godot not found."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Scarlet Veil project: $PROJECT_DIR"

          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/export_presets.cfg"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest"

      - name: Download Godot and export templates
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" \
            -O /tmp/godot.zip

          rm -rf /tmp/godot
          mkdir -p /tmp/godot

          unzip -q /tmp/godot.zip -d /tmp/godot

          GODOT_BIN="/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"

          chmod +x "$GODOT_BIN"
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot

          godot --version

          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" \
            -O /tmp/templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates

          unzip -q /tmp/templates.tpz -d /tmp/godot_templates

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"

          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot_templates/templates/. "$TEMPLATE_DIR/"

          test -f "$TEMPLATE_DIR/android_debug.apk"

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Scarlet Veil,C=US" \
            -storetype JKS \
            -noprompt

          echo "Debug keystore created."

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Fix Android export settings
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])

          preset = root / "export_presets.cfg"
          p = preset.read_text(encoding="utf-8")

          p = re.sub(
              r'^gradle_build/min_sdk\s*=.*$',
              'gradle_build/min_sdk=""',
              p,
              flags=re.MULTILINE
          )

          p = re.sub(
              r'^gradle_build/target_sdk\s*=.*$',
              'gradle_build/target_sdk=""',
              p,
              flags=re.MULTILINE
          )

          preset.write_text(p, encoding="utf-8")

          project = root / "project.godot"
          t = project.read_text(encoding="utf-8")

          key = "textures/vram_compression/import_etc2_astc"

          if re.search(r'^' + re.escape(key) + r'\s*=', t, flags=re.MULTILINE):
              t = re.sub(
                  r'^' + re.escape(key) + r'\s*=.*$',
                  key + '=true',
                  t,
                  flags=re.MULTILINE
              )
          elif "[rendering]" in t:
              t = t.replace(
                  "[rendering]",
                  "[rendering]\n" + key + "=true",
                  1
              )
          else:
              t += "\n[rendering]\n" + key + "=true\n"

          project.write_text(t, encoding="utf-8")
          PY

          rm -rf "$PROJECT_DIR/.godot"

      - name: Patch Scarlet Veil runtime and black-screen errors
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])

          # =========================================================
          # FIX 1 — AUDIO BUS
          # =========================================================
          bus_file = root / "default_bus_layout.tres"

          bus_text = "\n".join([
              '[gd_resource type="AudioBusLayout" format=3]',
              '',
              '[resource]',
              '',
              'bus/0/name = &"Master"',
              'bus/0/solo = false',
              'bus/0/mute = false',
              'bus/0/bypass_fx = false',
              'bus/0/volume_db = 0.0',
              'bus/0/send = &""',
              ''
          ])

          bus_file.write_text(bus_text, encoding="utf-8")
          print("Fixed default_bus_layout.tres")

          # =========================================================
          # FIX 2 — SAVE MANAGER TYPE
          # =========================================================
          save_file = root / "scripts" / "save_manager.gd"
          save_text = save_file.read_text(encoding="utf-8")

          save_text = save_text.replace(
              'var settings := default_data()["settings"]',
              'var settings: Dictionary = default_data()["settings"].duplicate(true)'
          )

          save_file.write_text(save_text, encoding="utf-8")
          print("Fixed save_manager.gd")

          # =========================================================
          # FIX 3 — TITLE SCREEN TYPE
          # =========================================================
          title_file = root / "ui" / "title_screen.gd"
          title_text = title_file.read_text(encoding="utf-8")

          title_text = title_text.replace(
              "var subtitle := subtitle_node",
              "var subtitle: Label = subtitle_node as Label"
          )

          title_file.write_text(title_text, encoding="utf-8")
          print("Fixed title_screen.gd")

          # =========================================================
          # FIX 4 — INTRO -> BLACK SCREEN
          #
          # OLD:
          # loading screen -> intro -> instantiate world
          #
          # NEW:
          # loading screen -> instantiate world -> intro -> reveal world
          # =========================================================
          main_file = root / "scripts" / "main.gd"
          main_text = main_file.read_text(encoding="utf-8")

          new_start_game = """func _start_game(play_intro: bool) -> void:
          \tif is_instance_valid(title_screen):
          \t\ttitle_screen.queue_free()
          \t\ttitle_screen = null

          \tloading_screen = LOADING_SCENE.instantiate()
          \tadd_child(loading_screen)

          \tAudioManager.stop_music(0.2)

          \tvar request_error := ResourceLoader.load_threaded_request(
          \t\tWORLD_PATH,
          \t\t"PackedScene"
          \t)

          \tif request_error != OK:
          \t\tpush_error("Scarlet Veil: failed to request World.tscn.")
          \t\tshow_title()
          \t\treturn

          \tvar progress := []
          \tvar minimum_show_time := 1.75
          \tvar shown := 0.0

          \twhile true:
          \t\tvar status := ResourceLoader.load_threaded_get_status(
          \t\t\tWORLD_PATH,
          \t\t\tprogress
          \t\t)

          \t\tvar p := 0.0

          \t\tif not progress.is_empty():
          \t\t\tp = clampf(float(progress[0]), 0.0, 1.0)

          \t\tloading_screen.set_progress(
          \t\t\tp,
          \t\t\t_loading_stage(p)
          \t\t)

          \t\tawait get_tree().process_frame
          \t\tshown += get_process_delta_time()

          \t\tif status == ResourceLoader.THREAD_LOAD_FAILED or status == ResourceLoader.THREAD_LOAD_INVALID_RESOURCE:
          \t\t\tpush_error("Scarlet Veil: World.tscn loading failed.")
          \t\t\tshow_title()
          \t\t\treturn

          \t\tif status == ResourceLoader.THREAD_LOAD_LOADED and shown >= minimum_show_time:
          \t\t\tbreak

          \tloading_screen.set_progress(
          \t\t1.0,
          \t\t"AWAKENING CAEL MOURNE"
          \t)

          \t# Instantiate gameplay BEFORE the intro.
          \t# The loading screen hides this initialization.
          \tvar packed = ResourceLoader.load_threaded_get(WORLD_PATH)

          \tif not (packed is PackedScene):
          \t\tpush_error("Scarlet Veil: World.tscn is invalid.")
          \t\tshow_title()
          \t\treturn

          \tworld = packed.instantiate()
          \tadd_child(world)

          \tif world.has_signal("return_to_title"):
          \t\tworld.return_to_title.connect(show_title)

          \t# Let World, Seren, Camera2D and HUD fully enter the tree.
          \tawait get_tree().process_frame
          \tawait get_tree().process_frame
          \tawait get_tree().process_frame

          \tloading_screen.finish()
          \tawait loading_screen.finished

          \tloading_screen.queue_free()
          \tloading_screen = null

          \tawait get_tree().process_frame

          \tif play_intro:
          \t\tawait _play_intro()

          \t# Make absolutely sure the intro CanvasLayer has been freed
          \t# before gameplay becomes visible.
          \tawait get_tree().process_frame
          \tawait get_tree().process_frame"""

          pattern = (
              r'func _start_game\(play_intro: bool\) -> void:\n'
              r'.*?'
              r'(?=\nfunc _loading_stage\(p: float\) -> String:)'
          )

          main_text, replacements = re.subn(
              pattern,
              new_start_game,
              main_text,
              count=1,
              flags=re.DOTALL
          )

          if replacements != 1:
              raise RuntimeError(
                  "Could not patch _start_game() in scripts/main.gd"
              )

          main_file.write_text(main_text, encoding="utf-8")

          print("Fixed main.gd intro/world loading order")
          print("All Scarlet Veil patches completed.")
          PY

          rm -rf "$PROJECT_DIR/.godot"

      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail

          IMPORT_LOG="$GITHUB_WORKSPACE/godot-import.log"

          set +e

          godot \
            --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit \
            >"$IMPORT_LOG" 2>&1

          CODE=$?

          set -e

          cat "$IMPORT_LOG"

          if [ "$CODE" -ne 0 ]; then
            echo "Godot import failed."
            exit "$CODE"
          fi

          if grep -E \
            "SCRIPT ERROR|Parse Error|Cannot load|Failed loading resource" \
            "$IMPORT_LOG"; then

            echo "Godot import found a script/resource problem."
            exit 1
          fi

          echo "Godot import passed."

      - name: Title screen runtime smoke test
        shell: bash
        run: |
          set -euo pipefail

          LOG="$GITHUB_WORKSPACE/godot-smoke.log"

          set +e

          timeout 8s godot \
            --headless \
            --audio-driver Dummy \
            --path "$PROJECT_DIR" \
            >"$LOG" 2>&1

          CODE=$?

          set -e

          cat "$LOG"

          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then
            echo "Godot exited unexpectedly with code $CODE"
            exit "$CODE"
          fi

          if grep -E \
            "SCRIPT ERROR|Parse Error|Invalid get index|Invalid call|Cannot load|Failed loading resource|Invalid access|Nonexistent function" \
            "$LOG"; then

            echo "Title screen smoke test found an error."
            exit 1
          fi

          echo "Title screen smoke test passed."

      - name: Gameplay world smoke test
        shell: bash
        run: |
          set -euo pipefail

          LOG="$GITHUB_WORKSPACE/world-smoke.log"

          set +e

          timeout 12s godot \
            --headless \
            --audio-driver Dummy \
            --path "$PROJECT_DIR" \
            "res://world/World.tscn" \
            >"$LOG" 2>&1

          CODE=$?

          set -e

          cat "$LOG"

          # 124 = timeout, which is expected because the game
          # continues running after World.tscn successfully boots.
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then
            echo "GAMEPLAY WORLD CRASHED WITH CODE $CODE"
            exit "$CODE"
          fi

          if grep -E \
            "SCRIPT ERROR|Parse Error|Invalid get index|Invalid call|Cannot load|Failed loading resource|Invalid access|Nonexistent function|Attempt to call" \
            "$LOG"; then

            echo "GAMEPLAY WORLD TEST FAILED"
            exit 1
          fi

          echo "======================================"
          echo "GAMEPLAY WORLD BOOTED SUCCESSFULLY"
          echo "======================================"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"

          OUTPUT_DIR="$GITHUB_WORKSPACE/builds/android"
          OUTPUT_APK="$OUTPUT_DIR/ScarletVeil.apk"

          mkdir -p "$OUTPUT_DIR"

          godot \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$OUTPUT_APK"

          test -s "$OUTPUT_APK"

          echo "======================================"
          echo "SCARLET VEIL APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$OUTPUT_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScarletVeil-Android-debug
          path: builds/android/ScarletVeil.apk
          if-no-files-found: error
          retention-days: 14
